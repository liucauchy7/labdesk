plugins {
    id "com.android.application"
}

android {
    namespace "cn.ninglab.labdesk"
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "cn.ninglab.labdesk"
        minSdk 26
        targetSdk 34
        versionCode 20
        versionName "1.6.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "androidx.core:core:1.15.0"
}
